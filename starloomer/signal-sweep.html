<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Starloomer Signal Sweep v0.1.1 | Browser Receiver</title><script src="signal-sweep-browser-core.js"></script><style>body{margin:0;background:#08100f;color:#dff;font:16px Consolas;padding:24px}.w{max-width:1000px;margin:auto}.p{border:1px solid #386c66;background:#0d1917;padding:18px;border-radius:10px;margin:12px 0}button,input{font:inherit;padding:12px;margin:4px;background:#7fe0d1;border:0;border-radius:6px}input{background:#132522;color:#fff;border:1px solid #386c66}.opts button{display:block;width:100%;text-align:left}.out{white-space:pre-wrap;background:#050908;padding:16px;min-height:120px}</style></head><body><div class=w><div style="border:1px solid #386c66;background:#122c2b;padding:10px;border-radius:8px;margin-bottom:18px;font-size:13px">ORIGINAL SIGNAL SWEEP v0.1.1 GAMEPLAY // Crew, XP, and discoveries are saved in this browser only, not the shared CORE. <a href="./" style="color:#7fe0d1">← Starloomer Games</a></div><div>CC116 COMMUNICATIONS DIVISION</div><h1>STARLOOMER // SIGNAL SWEEP</h1><div class=p><input id=c value="Guest_Pilot"><button id=l>LOAD CREW</button><div id=crew></div></div><div class=p><button id=s disabled>BEGIN SIGNAL SWEEP</button><div id=sig>Receiver idle.</div><div class=opts id=o></div></div><div class="p out" id=r>Console ready.</div></div><script>let cs='';const $=x=>document.querySelector(x);async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.detail||r.status);return d}function render(p){cs=p.crew.callsign;$('#crew').textContent=`${cs} // LEVEL ${p.crew.level} // ${p.resources.signal_data||0} SIGNAL DATA`;$('#s').disabled=!!p.pending_sweep;if(p.pending_sweep)show(p.pending_sweep)}function show(x){$('#sig').innerHTML=`<h2>${x.name}</h2><p>${x.description}</p>`;$('#o').innerHTML=x.options.map(q=>`<button data-id="${q.id}">${q.label}<br><small>${q.skill.toUpperCase()} ${q.effective_skill} // ~${Math.round(q.success_chance*100)}%</small></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>resolve(b.dataset.id))}$('#l').onclick=async()=>render(await api('/api/crew',{method:'POST',body:JSON.stringify({callsign:$('#c').value})}));$('#s').onclick=async()=>show((await api('/api/sweep/start',{method:'POST',body:JSON.stringify({callsign:cs})})).pending_sweep);async function resolve(id){let d=await api('/api/sweep/resolve',{method:'POST',body:JSON.stringify({callsign:cs,option_id:id})});$('#r').textContent=d.broadcast_text;$('#sig').textContent='Receiver idle.';$('#o').innerHTML='';render(d)}</script></body></html>
